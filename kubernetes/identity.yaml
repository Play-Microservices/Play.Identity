apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-deployment
  labels:
    app: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity
  template:
    metadata:
      name: identity
      labels:
        app: identity
    spec:
      containers:
        - name: identity
          image: playeconomy.azurecr.io/play.identity:1.0.4
          imagePullPolicy: IfNotPresent
          resources:
            memory: "128Mi"
            cpu: "150m"
          env:
            - name: ServiceSettings__MessageBroker
              value: SERVICEBUS
            - name: ServiceBusSettings__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: identity-secrets
                  key: servicebus-connectionstring
            - name: MongoDbSettings__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: identity-secrets
                  key: cosmosdb-connectionstring
            - name: IdentitySettings__AdminUserPassword
              valueFrom:
                secretKeyRef:
                  name: identity-secrets
                  key: admin-password
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
      